[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "reach-or-cue"
version = "0.1"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.3",
    "scipy==1.18.1",
    "pandas==3.0.5",
    "scikit-learn==1.9.1",
    "matplotlib==3.11.2",
]

[tool.setuptools]
packages = ["reach_or_cue"]
